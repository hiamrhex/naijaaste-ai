<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#080810" />
  <title>Offline — NaijaTaste AI</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <style>
    body { margin: 0; background: #080810; color: #F9FAFB; font-family: 'DM Sans', 'Segoe UI', sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; box-sizing: border-box; }
    .box { text-align: center; max-width: 340px; }
    .mark { width: 52px; height: 52px; border-radius: 14px; margin: 0 auto 16px; display: flex; align-items: center; justify-content: center; font-family: sans-serif; font-weight: 800; font-size: 24px; color: #fff; background: linear-gradient(135deg, #F97316, #FB923C); }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { font-size: 14px; color: #9CA3AF; margin: 0 0 20px; line-height: 1.6; }
    a { display: inline-block; background: linear-gradient(120deg, #F97316, #FB923C); color: #fff; text-decoration: none; font-weight: 700; font-size: 14px; padding: 12px 26px; border-radius: 11px; min-height: 20px; }
  </style>
</head>
<body>
  <div class="box">
    <div class="mark">N</div>
    <h1>You're offline</h1>
    <p>NaijaTaste needs a connection to find fresh spots. Check your network and try again — your saved places will be here when you're back.</p>
    <a href="/app" id="retry">Try again</a>
  </div>
  <script src="/offline.js" defer></script>
</body>
</html>
