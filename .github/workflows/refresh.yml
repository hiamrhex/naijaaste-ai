name: Daily OSM refresh

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

# Least privilege: this job reads the repo and talks to Postgres/Overpass.
# It never needs to write anything back to GitHub.
permissions:
  contents: read

# One refresh at a time. Two overlapping runs would double the Overpass load
# and race on the same rows for no benefit.
concurrency:
  group: refresh-osm
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # The direct Neon URL is preferred for migrations (the pooler can move a
      # session mid-statement). Fall back to the pooled URL so the job keeps
      # working if only one secret is configured.
      DATABASE_URL: ${{ secrets.DATABASE_URL_DIRECT || secrets.DATABASE_URL }}
      DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}
      GEMINI_API_KEY: ci-not-needed
      JWT_ACCESS_SECRET: ci-not-needed
      JWT_REFRESH_SECRET: ci-not-needed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --omit=dev

      # Fail in seconds with an actionable message instead of an opaque
      # "DATABASE_URL is not set" exit code after a full install. Never echo
      # the URL itself.
      - name: Preflight — a database URL must be configured
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::No database URL configured. Add the repository secret DATABASE_URL_DIRECT (preferred) or DATABASE_URL. See docs/DEPLOYMENT.md."
            exit 1
          fi
          echo "database URL configured (${#DATABASE_URL} chars)"

      - name: Migrate (direct URL — never the pooler)
        run: npm run db:migrate
        timeout-minutes: 5

      - name: Import 4 cities from Overpass
        run: node src/data/import-osm.js
        timeout-minutes: 15
