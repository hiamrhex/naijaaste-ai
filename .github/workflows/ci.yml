name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # Service-worker assertions run against the real dist/sw.js, so they
      # must come after the build that produces it. Guards the offline-page
      # regression (server 4xx/5xx must not be replaced by offline.html).
      - run: npm run test:sw

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Fails only on CRITICAL in prod deps. Known HIGHs are build-toolchain
      # (Vite chain, unreachable at runtime) — triaged in docs/SECURITY.md.
      - run: npm audit --omit=dev --audit-level=critical
      - run: npm run scan:secrets
      # Docs drift gate: stale numbers, broken internal links, unbalanced
      # Mermaid fences, or an `npm run <x>` referenced in README that doesn't
      # exist. Fails the build — code wins over docs.
      - run: npm run check:docs

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
        env:
          GEMINI_API_KEY: ci-not-needed
          JWT_ACCESS_SECRET: ci-access-secret-0123456789abcdef
          JWT_REFRESH_SECRET: ci-refresh-secret-fedcba9876543210
      - run: npx playwright test
        env:
          GEMINI_API_KEY: ci-not-needed
          JWT_ACCESS_SECRET: ci-access-secret-0123456789abcdef
          JWT_REFRESH_SECRET: ci-refresh-secret-fedcba9876543210
